; ScreenshotService - English
;
; This file is the template for every other language. To add one, copy it to
; <tag>.ini next to this file - fr.ini, es.ini, pl.ini - and translate the text
; to the right of each "=". The new language appears in Settings by itself; no
; rebuild and no restart.
;
; Rules, all of them:
;   * Save the file as UTF-8. Umlauts, accents and anything else are fine.
;   * Only the text after "=" is translated. Never change a key name.
;   * A key you leave out, or leave empty, falls back to English on its own,
;     so a half-finished translation is perfectly usable.
;   * "&" marks the keyboard shortcut letter: "&Browse..." is Alt+B. Pick a
;     letter that makes sense in your language, and do not use the same one
;     twice within the settings window.
;   * \n is a line break, \t a tab, \\ a literal backslash.
;   * %1, %2 are values the program fills in. Keep them, but put them wherever
;     your grammar wants - the order here does not bind you.
;   * Product names stay as they are in every language: ScreenshotService,
;     snip, HDR, PrtScn, Win+Shift+S, .jxr, .png, .wav, .mp4, H.264, HEVC, GDI.
;     Someone looking for ".jxr" should find ".jxr".
;
; Log lines are diagnostics, not interface, and are always English.

